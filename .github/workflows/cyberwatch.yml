name: CyberWatch Intelligence Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  cyberwatch-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create environment file
        working-directory: backend
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" > .env

      - name: Initialize database
        working-directory: backend
        run: |
          python -m database.db

      - name: Collect cyber incidents
        working-directory: backend
        run: |
          python -m services.collector

      - name: AI process incidents
        working-directory: backend
        run: |
          python -m services.ai_processor

      - name: Deduplicate incidents
        working-directory: backend
        run: |
          python -m services.deduplicator

      - name: Geocode incidents
        working-directory: backend
        run: |
          python -m services.geocoder

      - name: Save updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f backend/database/cyberwatch.db
          git diff --cached --quiet || git commit -m "chore: update CyberWatch intelligence database"
          git push
